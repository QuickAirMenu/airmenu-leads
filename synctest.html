<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>synctest</title></head>
<body>
<pre id="out">START</pre>
<script>
var o = document.getElementById("out");
function log(s){ o.textContent += "\n" + s; }

// --- JSONBlob ---
fetch("https://jsonblob.com/api/jsonBlob", {method:"POST", headers:{"Content-Type":"application/json"}, body:'{"probe":"jb"}'})
  .then(function(r){ log("JB_CREATE=" + r.status + " acao=" + r.headers.get("access-control-allow-origin")); return r.headers.get("Location"); })
  .then(function(loc){ log("JB_LOC=" + loc); if(!loc) return null;
     return fetch(loc, {cache:"no-store"}).then(function(r){return r.text();}).then(function(t){ log("JB_READ=" + t); return loc; }); })
  .then(function(loc){ if(!loc) return null;
     return fetch(loc, {method:"PUT", headers:{"Content-Type":"application/json"}, body:'{"probe":"jb2"}'}).then(function(r){ log("JB_PUT=" + r.status); }); })
  .catch(function(e){ log("JB_ERR=" + e); });

// --- KVdb ---
fetch("https://kvdb.io/", {method:"POST"})
  .then(function(r){ return r.text(); })
  .then(function(b){ log("KV_BUCKET=" + b.trim());
     return fetch("https://kvdb.io/" + b.trim() + "/state", {method:"POST", body:"hello"}); })
  .then(function(r){ log("KV_POST=" + r.status); })
  .catch(function(e){ log("KV_ERR=" + e); });
</script>
</body></html>

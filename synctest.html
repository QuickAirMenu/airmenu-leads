<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>synctest</title></head>
<body>
<pre id="out">START</pre>
<script>
var o = document.getElementById("out");
function log(s){ o.textContent += "\n" + s; }

// --- jsonbox ---
fetch("https://jsonbox.io/airmenu-comm-9f3a", {method:"POST", headers:{"Content-Type":"application/json"}, body:'{"p":1}'})
  .then(function(r){ log("XBOX_STATUS=" + r.status); return r.text(); })
  .then(function(t){ log("XBOX_BODY=" + t); })
  .catch(function(e){ log("XBOX_ERR=" + e); });

// --- extendsclass json storage ---
fetch("https://json.extendsclass.com/bin", {method:"POST", headers:{"Content-Type":"application/json"}, body:'{"p":1}'})
  .then(function(r){ log("EC_STATUS=" + r.status); return r.text(); })
  .then(function(t){ log("EC_BODY=" + t); })
  .catch(function(e){ log("EC_ERR=" + e); });
</script>
</body></html>

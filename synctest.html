<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>synctest</title></head>
<body>
<pre id="out">START</pre>
<script>
var o = document.getElementById("out");
function log(s){ o.textContent += "\n" + s; }
fetch("https://kvdb.io/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"email=sales@airmenu.net"})
  .then(function(r){ log("KV_CREATE_STATUS=" + r.status); return r.text(); })
  .then(function(bk){
     log("KV_BUCKET=" + bk.trim());
     var b = bk.trim().replace(/\/+$/,''); b = b.substring(b.lastIndexOf('/')+1);
     log("KV_ID=" + b);
     return fetch("https://kvdb.io/" + b + "/state", {method:"POST", body:'{"p":1}'})
       .then(function(r){ log("KV_POST=" + r.status); })
       .then(function(){ return fetch("https://kvdb.io/" + b + "/state"); })
       .then(function(r){ return r.text(); })
       .then(function(t){ log("KV_READ=" + t); });
  })
  .catch(function(e){ log("KV_ERR=" + e); });
</script>
</body></html>
